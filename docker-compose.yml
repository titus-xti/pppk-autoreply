version: "3.9"
services:
  app:
    build: .
    image: go-whatsapp-app:latest
    container_name: go-whatsapp-app
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"  # Run as non-root user with UID 1000
    volumes:
      - ./data:/app
      - ./session.db:/app/session.db  # Explicitly mount the database file
      - /root/autoreply/data:/app/qr
    environment:
      - TZ=Asia/Jakarta
    # Ensure the container has enough memory
    mem_limit: 1G
    mem_reservation: 512M

version: "3.9"
services:
  app:
    build: .
    image: go-whatsapp-app:latest
    container_name: go-whatsapp-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8081:8080"
    environment:
      - TZ=Asia/Jakarta
    # Ensure the container has enough memory
    mem_limit: 1G
    mem_reservation: 512M
